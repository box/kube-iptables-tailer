version: 2
jobs:
  build:
    docker:
      - image: circleci/python:3
    steps:
      - checkout
      - bot/docker-build-and-push:
          multiArchEnable: true
workflows:
  version: 2
  build:
    jobs:
      - build:
          context: org-global
  build-tags:
    jobs:
      - build:
          context: org-global
          filters:
            tags:
              only: /.*/
